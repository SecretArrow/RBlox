name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Buat GitHub Release (APK) setelah build sukses"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" "platform-tools" > /dev/null

      - name: Cache Godot editor & templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Cache Gradle (AGP & dependensi)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot-${{ env.GODOT_VERSION }}-android34

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}"
          curl -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          curl -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          unzip -o /tmp/godot.zip -d /tmp/godotbin
          sudo mv /tmp/godotbin/Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -o /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${V}.stable/

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          ls -l "$HOME/.android/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          # Isi eksplisit keystore debug & release ke preset (export-release pakai keystore/release)
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$HOME/.android/debug.keystore\"|; s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|; s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|; s|keystore/release=\"\"|keystore/release=\"$HOME/.android/debug.keystore\"|; s|keystore/release_user=\"\"|keystore/release_user=\"androiddebugkey\"|; s|keystore/release_password=\"\"|keystore/release_password=\"android\"|" export_presets.cfg
          grep -n "keystore/\|gradle_build_directory" export_presets.cfg

      - name: Install Android build template (gradle)
        run: |
          set -e
          TPLDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p android/build
          unzip -o "$TPLDIR/android_source.zip" -d android/build
          # Penanda versi template di PARENT build dir (persis perilaku editor Godot)
          echo "${GODOT_VERSION}.stable" > android/.build_version
          # Hindari Godot mem-scan pohon gradle sebagai resource
          touch android/build/.gdignore
          ls android/build | head -6

      - name: Import project assets
        run: godot --headless --import --path "$PWD"

      - name: Smoke test headless (cek error skrip)
        run: |
          set -o pipefail
          timeout 120 godot --headless --quit-after 30 --path "$PWD" 2>&1 | tee smoke.log
          if grep -qE "SCRIPT ERROR|Parse Error" smoke.log; then
            echo "::error::Error skrip terdeteksi saat smoke test"
            exit 1
          fi

      - name: Export APK universal
        run: |
          set -e
          mkdir -p build
          godot --headless --export-release "Android" build/RBlox-universal.apk --path "$PWD" || {
            echo "::warning::Export gradle gagal, fallback ke preset prebuilt (Android-Quick)"
            godot --headless --export-release "Android-Quick" build/RBlox-universal.apk --path "$PWD"
          }
          ls -lh build

      - name: Export APK split per ABI
        run: |
          set -e
          godot --headless --export-release "Android-arm64"   build/RBlox-arm64-v8a.apk    --path "$PWD"
          godot --headless --export-release "Android-armv7"   build/RBlox-armeabi-v7a.apk  --path "$PWD"
          godot --headless --export-release "Android-x86_64"  build/RBlox-x86_64.apk       --path "$PWD"
          ls -lh build

      - name: Check APK sizes (max 300MB each)
        run: |
          fail=0
          for f in build/RBlox-*.apk; do
            SIZE=$(du -m "$f" | cut -f1)
            echo "APK: $(basename "$f") = ${SIZE} MB"
            if [ "$SIZE" -gt 300 ]; then echo "::error::$f melebihi 300MB"; fail=1; fi
          done
          exit $fail

      - name: Upload APK artifacts (split per ABI + universal)
        uses: actions/upload-artifact@v4
        with:
          name: RBlox-Android
          path: |
            build/RBlox-universal.apk
            build/RBlox-arm64-v8a.apk
            build/RBlox-armeabi-v7a.apk
            build/RBlox-x86_64.apk
          retention-days: 14
          if-no-files-found: error

  dev-release:
    name: Dev pre-release (continuous)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: RBlox-Android
          path: build
      - name: Upsert pre-release dev-build (split per ABI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true
          gh release create dev-build build/RBlox-*.apk --prerelease --title "RBlox Dev Build" --notes "Build otomatis dari commit $GITHUB_SHA (split per ABI).\n\nPilih sesuai CPU HP:\n- arm64-v8a → HP modern (disarankan)\n- armeabi-v7a → HP lama\n- x86_64 → emulator/ChromeOS\n- universal → semua arsitektur\n\nInstall: unduh APK, izinkan install dari sumber tidak dikenal. 100% gratis, tanpa iklan."

  tag-release:
    name: GitHub Release (tag v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: RBlox-Android
          path: build
      - name: Create release (split per ABI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then TAG="v$(date +%Y%m%d%H%M)-manual"; fi
          sleep 10
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "RBlox $TAG — split per ABI" --generate-notes
          gh release upload "$TAG" build/RBlox-*.apk --clobber
